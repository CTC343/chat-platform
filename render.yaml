services:
  - type: web
    name: chat-platform
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: chat-db
          property: connectionString
      - key: ADMIN_PASSWORD
        value: "admin123456"
      - key: TOKEN_EXPIRE_MINUTES
        value: "1440"
    healthCheckPath: /health

databases:
  - name: chat-db
    plan: free
    databaseName: chat_db
    user: chat_user
