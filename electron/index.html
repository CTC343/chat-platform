<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聊天平台</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background-color: #1a1a2e;
      color: #e6e6e6;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    .titlebar {
      height: 32px;
      background-color: #16213e;
      display: flex;
      align-items: center;
      padding: 0 16px;
      -webkit-app-region: drag;
      user-select: none;
    }
    
    .titlebar-title {
      font-size: 12px;
      color: #a0a0a0;
    }
    
    .content {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 20px;
    }
    
    .logo {
      font-size: 64px;
    }
    
    h1 {
      font-size: 24px;
      color: #e94560;
    }
    
    p {
      color: #a0a0a0;
      text-align: center;
      max-width: 400px;
    }
    
    .btn {
      padding: 12px 24px;
      background-color: #e94560;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    
    .btn:hover {
      background-color: #d63851;
    }
    
    .server-input {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    
    .server-input input {
      padding: 12px 16px;
      background-color: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 8px;
      color: #e6e6e6;
      font-size: 14px;
      width: 300px;
    }
    
    .server-input input:focus {
      outline: none;
      border-color: #e94560;
    }
    
    .status {
      font-size: 12px;
      color: #666666;
    }
  </style>
</head>
<body>
  <div class="titlebar">
    <span class="titlebar-title">聊天平台</span>
  </div>
  
  <div class="content">
    <div class="logo">💬</div>
    <h1>多人聊天平台</h1>
    <p>请确保后端服务器已启动，然后输入服务器地址连接</p>
    
    <div class="server-input">
      <input type="text" id="server-url" placeholder="http://localhost:8000" value="http://localhost:8000">
      <button class="btn" onclick="connectToServer()">连接</button>
    </div>
    
    <p class="status" id="status">等待连接...</p>
  </div>

  <script>
    const { shell } = require('electron');
    
    function connectToServer() {
      const url = document.getElementById('server-url').value.trim();
      const status = document.getElementById('status');
      
      if (!url) {
        status.textContent = '请输入服务器地址';
        status.style.color = '#ef4444';
        return;
      }
      
      status.textContent = '正在连接...';
      status.style.color = '#a0a0a0';
      
      // 检查服务器是否可达
      fetch(`${url}/health`)
        .then(response => response.json())
        .then(data => {
          if (data.status === 'healthy') {
            status.textContent = '连接成功！正在打开聊天界面...';
            status.style.color = '#4ade80';
            
            // 在默认浏览器中打开
            shell.openExternal(url);
            
            // 或者在窗口中加载
            setTimeout(() => {
              window.location.href = url;
            }, 1000);
          } else {
            status.textContent = '服务器响应异常';
            status.style.color = '#ef4444';
          }
        })
        .catch(error => {
          status.textContent = '无法连接到服务器，请检查地址和服务状态';
          status.style.color = '#ef4444';
          console.error('连接错误:', error);
        });
    }
    
    // 回车键连接
    document.getElementById('server-url').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        connectToServer();
      }
    });
  </script>
</body>
</html>
