<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理面板 - 多人聊天平台</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <div class="admin-container">
    <div class="admin-header">
      <h1>⚙️ 管理面板</h1>
      <button class="btn btn-secondary" onclick="window.location.href='/chat.html'">返回聊天</button>
    </div>
    
    <div class="admin-tabs">
      <button class="tab-btn active" id="tab-users" onclick="switchTab('users')">
        待审核用户 (<span id="pending-count">0</span>)
      </button>
      <button class="tab-btn" id="tab-messages" onclick="switchTab('messages')">
        所有消息 (<span id="message-count">0</span>)
      </button>
    </div>
    
    <div class="admin-content">
      <div id="users-section">
        <div class="no-data" id="no-users">暂无待审核用户</div>
        <div class="users-list" id="users-list"></div>
      </div>
      
      <div id="messages-section" style="display:none">
        <div class="no-data" id="no-messages">暂无消息</div>
        <div class="messages-list" id="messages-list"></div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
