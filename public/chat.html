<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聊天 - 多人聊天平台</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/chat.css">
</head>
<body>
  <div class="chat-container">
    <!-- 侧边栏 -->
    <div class="sidebar">
      <div class="sidebar-header">
        <h2>💬 聊天平台</h2>
        <div class="user-info">
          <span class="user-nickname" id="user-nickname">加载中...</span>
          <span class="user-role" id="user-role">用户</span>
        </div>
      </div>
      
      <div class="sidebar-content">
        <div class="chat-mode-selector">
          <button class="mode-btn active" id="btn-public" onclick="switchToPublic()">公共大厅</button>
          <button class="mode-btn" id="btn-private" onclick="toggleUserList()">私密消息</button>
        </div>
        
        <div class="user-list" id="user-list" style="display:none">
          <h3>选择用户进行私聊</h3>
          <div id="users-container"></div>
        </div>
        
        <div class="admin-section" id="admin-section" style="display:none">
          <a href="/admin.html" class="admin-link">⚙️ 管理面板</a>
        </div>
      </div>
      
      <div class="sidebar-footer">
        <button class="btn btn-secondary logout-btn" onclick="api.logout()">退出登录</button>
      </div>
    </div>
    
    <!-- 聊天主区域 -->
    <div class="chat-main">
      <div class="chat-header">
        <h3 id="chat-title">公共聊天大厅</h3>
        <span class="private-indicator" id="private-indicator" style="display:none">仅双方可见</span>
      </div>
      
      <div class="messages-container" id="messages-container">
        <div class="no-messages" id="no-messages">
          <p>暂无消息</p>
          <p>开始发送第一条消息吧！</p>
        </div>
      </div>
      
      <div class="message-input-container">
        <form class="message-form" id="message-form" onsubmit="sendMessage(event)">
          <button type="button" class="attach-btn" onclick="document.getElementById('file-input').click()">📎</button>
          <input type="text" class="message-input" id="message-input" placeholder="发送消息..." autocomplete="off">
          <button type="submit" class="btn btn-primary send-btn" id="send-btn">发送</button>
        </form>
        <input type="file" id="file-input" style="display:none" onchange="uploadFile(event)">
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/chat.js"></script>
</body>
</html>
