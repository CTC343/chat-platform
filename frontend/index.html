<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1a1a2e">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <title>聊天平台</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/login.css">
</head>
<body>
  <div id="app">
    <div class="login-container">
      <div class="login-card">
        <h1 class="login-title">💬 多人聊天平台</h1>
        <p class="login-subtitle" id="subtitle">登录您的账号</p>
        
        <div id="error-message" class="error-message" style="display:none"></div>
        <div id="success-message" class="success-message" style="display:none"></div>
        
        <!-- 登录表单 -->
        <form id="login-form" class="form-container">
          <div class="form-group">
            <label for="username">用户名</label>
            <input type="text" id="username" placeholder="请输入用户名" required autocomplete="username">
          </div>
          <div class="form-group">
            <label for="password">密码</label>
            <input type="password" id="password" placeholder="请输入密码" required autocomplete="current-password">
          </div>
          <button type="submit" class="btn btn-primary btn-full">登录</button>
        </form>
        
        <!-- 注册表单 -->
        <form id="register-form" class="form-container" style="display:none">
          <div class="form-group">
            <label for="reg-username">用户名</label>
            <input type="text" id="reg-username" placeholder="请输入用户名" required autocomplete="username">
          </div>
          <div class="form-group">
            <label for="reg-nickname">昵称</label>
            <input type="text" id="reg-nickname" placeholder="请输入昵称" required>
          </div>
          <div class="form-group">
            <label for="reg-password">密码</label>
            <input type="password" id="reg-password" placeholder="请输入密码（至少6位）" required autocomplete="new-password">
          </div>
          <div class="form-group">
            <label for="reg-confirm">确认密码</label>
            <input type="password" id="reg-confirm" placeholder="请再次输入密码" required autocomplete="new-password">
          </div>
          <button type="submit" class="btn btn-primary btn-full">注册</button>
        </form>
        
        <div class="login-footer">
          <a href="#" id="toggle-form" class="link">没有账号？立即注册</a>
        </div>
      </div>
    </div>
  </div>
  
  <script src="/js/speed-insights.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    // 注册Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => console.log('SW registered:', reg.scope))
        .catch(err => console.error('SW registration failed:', err));
    }
  </script>
</body>
</html>
